spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/ethioloadai_spring}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway: the existing development history was repaired explicitly once;
  # future startup must fail on unexpected migration drift.
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing,*:future"

jwt:
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  header: Authorization
  prefix: Bearer

# Dev CORS: allow the default React dev server and common local ports.
# Override with CORS_ALLOWED_ORIGINS if running the frontend on a different port.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8765,http://localhost:8766,http://localhost:8767,http://127.0.0.1:8765,http://127.0.0.1:8766,http://127.0.0.1:8767}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    name: logs/application.log
  level:
    com.ethioloadai: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

carrier:
  invitations:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
