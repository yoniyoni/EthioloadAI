spring:
  mail:
    host: ethioloadai-e2e-mail-capture
    port: 12525
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.ssl.enable: false
      mail.smtp.starttls.enable: false
  datasource:
    url: ${E2E_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15433/ethioloadai_e2e}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    postgresql:
      transactional-lock: false
    enabled: true
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}
  sql:
    init:
      mode: never

flyway:
  custom:
    enabled: false

app:
  demo-seed:
    enabled: ${APP_DEMO_SEED_ENABLED:false}
    rotate-admin-password: ${APP_DEMO_SEED_ROTATE_ADMIN_PASSWORD:false}

e2e:
  datasource:
    mode: ${E2E_DATASOURCE_MODE:}
  mail:
    capture:
      enabled: ${E2E_MAIL_CAPTURE_ENABLED:false}
      sender: ${E2E_MAIL_CAPTURE_SENDER:}
  demo:
    admin-password: ${E2E_DEMO_ADMIN_PASSWORD:}
    shipper-password: ${E2E_DEMO_SHIPPER_PASSWORD:}
    driver-password: ${E2E_DEMO_DRIVER_PASSWORD:}

carrier:
  invitations:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    email-from: ${E2E_MAIL_CAPTURE_SENDER:}

ai-engine:
  enabled: false

routing:
  external-services:
    enabled: false

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5174,http://127.0.0.1:8765
