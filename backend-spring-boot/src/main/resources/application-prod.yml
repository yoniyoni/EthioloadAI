spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

# Deployment security requirement: configure and verify IP-based rate limits for
# login and registration at the trusted production ingress/gateway/WAF before
# requests reach Spring Boot. Use the actual connection/source IP, strip or
# overwrite untrusted client forwarding headers, and share enforcement across
# all Spring Boot instances. The in-process login limiter is defense in depth only;
# this profile does not configure or prove production edge enforcement.

b2:
  key-id: ${B2_KEY_ID}
  application-key: ${B2_APPLICATION_KEY}
  bucket-name: ${B2_BUCKET_NAME}
  endpoint: ${B2_ENDPOINT}
  region: ${B2_REGION}

# CORS: production origins must be set via CORS_ALLOWED_ORIGINS environment variable.
# Example: CORS_ALLOWED_ORIGINS=https://app.ethioloadai.com,https://admin.ethioloadai.com
# Never leave this as the localhost default in production.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# OpenAPI / SpringDoc — disabled in production.
# API documentation must not be publicly accessible on the production server.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.ethioloadai: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/ethioloadai/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

management:
  endpoint:
    health:
      show-details: never
