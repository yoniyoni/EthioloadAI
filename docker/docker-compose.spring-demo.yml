services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB to the verified demo database}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER to the verified demo database user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    networks:
      - application

  ai_engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai_engine.spring-demo
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - application

  spring:
    build:
      context: ../backend-spring-boot
      dockerfile: Dockerfile
      args:
        BUILD_BASE: ${SPRING_BUILD_BASE:?Set the approved Spring build image}
        RUNTIME_BASE: ${SPRING_RUNTIME_BASE:?Set the approved Spring runtime image}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai_engine:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB to the verified demo database}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER to the verified demo database user}
      SPRING_FLYWAY_ENABLED: "false"
      AI_ENGINE_URL: http://ai_engine:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the approved HTTPS frontend origin}
    secrets:
      - source: spring_database_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: spring_jwt_secret
        target: JWT_SECRET
      - source: b2_key_id
        target: B2_KEY_ID
      - source: b2_application_key
        target: B2_APPLICATION_KEY
      - source: b2_bucket_name
        target: B2_BUCKET_NAME
      - source: b2_endpoint
        target: B2_ENDPOINT
      - source: b2_region
        target: B2_REGION
    expose:
      - "8080"
    networks:
      - application

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - spring
    ports:
      - "${DEMO_BIND_ADDRESS:?Set the approved host bind address}:${DEMO_HTTP_PORT:?Set the approved demo HTTP port}:8080"
    volumes:
      - type: bind
        source: ../frontend/artifacts/freight-link/dist/public
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx.spring-demo.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - application

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set the protected existing database password file}
  spring_database_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set the protected existing database password file}
  spring_jwt_secret:
    file: ${JWT_SECRET_FILE:?Set the protected Spring JWT secret file}
  b2_key_id:
    file: ${B2_KEY_ID_FILE:?Set the protected B2 key ID file}
  b2_application_key:
    file: ${B2_APPLICATION_KEY_FILE:?Set the protected B2 application key file}
  b2_bucket_name:
    file: ${B2_BUCKET_NAME_FILE:?Set the protected B2 bucket name file}
  b2_endpoint:
    file: ${B2_ENDPOINT_FILE:?Set the protected B2 endpoint file}
  b2_region:
    file: ${B2_REGION_FILE:?Set the protected B2 region file}

volumes:
  postgres_data:
    external: true
    name: ${PGDATA_VOLUME:?Set the verified existing PostgreSQL data volume name}

networks:
  application:
