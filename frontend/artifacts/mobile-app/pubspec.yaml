name: ethioload_ai
description: "EthioLoad AI – AI-powered freight logistics for Ethiopia"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0

  # Networking
  dio: ^5.3.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Location / GPS
  geolocator: ^10.1.0

  # Map rendering (MapTiler raster tiles via api.maptiler.com, see map_config.dart)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Launching external navigation apps (Google Maps / Waze) for turn-by-turn
  url_launcher: ^6.3.0

  # In-app Chapa checkout (hosted payment page)
  webview_flutter: ^4.10.0

  # Localization
  easy_localization: ^3.0.7

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Logging
  logger: ^2.0.0

  # Image picking for document uploads
  image_picker: ^1.0.7

  # File picking (PDF) for document uploads
  file_picker: ^8.1.4

  # Date/time formatting — pinned to match flutter_localizations SDK constraint
  intl: ^0.20.2
  permission_handler: ^12.0.3
  # Ethiopian calendar display for shippers/drivers — see lib/src/utils/ethiopian_date.dart
  ethiopian_datetime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/languages/
